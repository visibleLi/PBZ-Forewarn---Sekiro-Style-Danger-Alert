name: verify

# Offline validation only: no game launch, no copyrighted audio.
# CI builds the bank from a short synthetic tone, so the produced ZIP is a
# structural artifact, not a release candidate. Releases are built by
# release.yml, which requires the real cue.wav from a repository secret.

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**' # historical 0.6.1 line
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reject tracked audio and build output
        run: |
          if git ls-files | grep -Ei '\.(wav|bnk|wem)$|(^|/)dist/|(^|/)generated/'; then
            echo '::error::Audio, banks and build output must never be tracked'
            exit 1
          fi

      - name: Install test dependency
        run: python -m pip install --target src/lua/tests/lib -r requirements-test.txt

      - name: Generate synthetic cue for the offline build
        run: |
          python - <<'PY'
          import array, math, wave
          rate, seconds = 44100, 0.25
          samples = array.array('h')
          for frame in range(int(rate * seconds)):
              value = round(256 * math.sin(2 * math.pi * 440 * frame / rate))
              samples.extend([value] * 2)
          with wave.open('src/js/PBZForewarn/cue.wav', 'wb') as audio:
              audio.setparams((2, 2, rate, 0, 'NONE', 'not compressed'))
              audio.writeframes(samples.tobytes())
          PY

      - name: Build the Wwise bank
        run: python tools/audio-bank/build_bank.py

      - name: Run offline checks
        run: python tools/verify.py --node "$(command -v node)"

      - name: Package the installer
        run: python tools/package.py

      - name: Report artifact hashes
        run: sha256sum dist/*.zip | tee dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbzforewarn-ci-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/PACKAGE_CHECK.json
          retention-days: 14
          if-no-files-found: error